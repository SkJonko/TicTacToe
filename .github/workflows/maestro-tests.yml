name: Maestro UI Tests

# Trigger on push and pull requests to any branch
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    # Set timeout to 60 minutes (emulator startup + APK build + tests can be slow)
    timeout-minutes: 60

    steps:
      # ========================================================================
      # STEP 1: Checkout code
      # ========================================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================================================
      # STEP 2: Setup Java (required for Android SDK and emulator)
      # ========================================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        # Java is required for:
        # - Android SDK build tools
        # - Android emulator
        # - Gradle build system used by MAUI
        # NOTE: we intentionally omit the `cache: 'gradle'` setting because
        # this repository does not contain any Gradle files. The default
        # behaviour causes an error when no files are found, so caching is
        # disabled here.  The Android SDK caching earlier in the workflow
        # already provides the main performance benefit.

      # ========================================================================
      # STEP 3: Setup .NET (required for MAUI project)
      # ========================================================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        # Install .NET SDK matching your MAUI project version

      # ========================================================================
      # STEP 4: Cache Android SDK
      # ========================================================================
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/local.properties') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-
        # Caching the Android SDK saves 2-5 minutes per run by avoiding
        # re-downloading a ~2GB SDK. This is the biggest time saver in this workflow.

      # ========================================================================
      # STEP 5: Install Android SDK components
      # ========================================================================
      - name: Install Android SDK components
        run: |
          # Update SDK manager
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --update --no_https --verbose 2>&1 | tail -1
          
          # Install required SDK components (these are essential for the emulator)
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" \
            "platform-tools" \
            "emulator" \
            --no_https --verbose 2>&1 | tail -5
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        # Installing:
        # - platforms;android-34: Required for building APK
        # - system-images for emulator: Google APIs image chosen for better compatibility
        # - platform-tools: adb, fastboot, etc.

      # ========================================================================
      # STEP 6: Create Android Virtual Device (AVD)
      # ========================================================================
      - name: Create Android Virtual Device
        run: |
          # remove existing AVD if present (sometimes leftover from cache)
          ${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager delete avd -n "Pixel_API_34" || true
          
          # Create AVD with optimized settings for CI environment
          echo "no" | ${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager create avd \
            -n "Pixel_API_34" \
            -k "system-images;android-34;google_apis;x86_64" \
            -d "Nexus 5X" \
            -f
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        # Creates an emulator named "Pixel_API_34" with:
        # - Android 14 (API 34) - modern API level for testing
        # - Google APIs - includes Play Services (useful for many apps)
        # - x86_64 architecture - fastest emulation on CI runners
        # - Nexus 5X device profile - standard portrait device

      # ========================================================================
      # STEP 7: Start Android Emulator
      # ========================================================================
      - name: Start Android Emulator
        run: |
          # Start emulator with performance optimizations for CI
          ${ANDROID_HOME}/emulator/emulator \
            -avd Pixel_API_34 \
            -no-snapshot-load \
            -no-window \
            -no-audio \
            -accel on \
            -cores 2 \
            -memory 2048 \
            -port 5554 \
            &> /tmp/emulator.log &
          
          # Wait for emulator to boot (monitor boot-complete property)
          echo "Waiting for emulator to boot..."
          timeout 300 bash -c 'until [[ -n $(${ANDROID_HOME}/platform-tools/adb shell getprop sys.boot_completed 2>&1 | grep "^1") ]]; do echo "Booting..." && sleep 5; done'
          ${ANDROID_HOME}/platform-tools/adb shell input keyevent 82 || true  # Unlock screen
          
          echo "Emulator is ready!"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        timeout-minutes: 10
        # Emulator launch flags:
        # -no-snapshot-load: Start clean (prevents issues from cached snapshots)
        # -no-window: Headless mode (essential for CI runners)
        # -no-audio: Disable audio to save resources
        # -accel on: Enable hardware acceleration (KVM on Linux)
        # -cores 2 & -memory 2048: Limit to avoid runner resource exhaustion
        # sys.boot_completed check: More reliable than waiting arbitrary time
        # 300s timeout: Emulator usually boots in 60-120s, 300s is safe margin

      # ========================================================================
      # STEP 8: Build MAUI Android APK
      # ========================================================================
      - name: Build MAUI Android APK
        run: |
          cd src/TicToe.Infinite
          dotnet publish -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:TrimPackageSize=true \
            --self-contained false
        # Building for Android:
        # - net10.0-android: Target framework for Android
        # - Release config: Creates optimized, smaller APK
        # - AndroidPackageFormat=apk: Generate APK (not AAB)
        # - Output: bin/Release/net10.0-android/publish/*.apk
        timeout-minutes: 15

      # ========================================================================
      # STEP 9: Find and install APK on emulator
      # ========================================================================
      - name: Install APK on emulator
        run: |
          # Find the APK file
          APK_PATH=$(find src/TicToe.Infinite/bin/Release/net10.0-android/publish -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          
          echo "Found APK: $APK_PATH"
          
          # Install on emulator
          ${ANDROID_HOME}/platform-tools/adb install -r "$APK_PATH"
          
          echo "APK installed successfully"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        # The "-r" flag allows reinstall if app already exists
        # Failure to install aborts the workflow (prevents invalid test runs)

      # ========================================================================
      # STEP 10: Install Maestro CLI
      # ========================================================================
      - name: Install Maestro CLI
        run: |
          # Download and install Maestro - Open source, free CLI tool
          curl -Ls "https://get.maestro.mobile/install.sh" | bash
          
          # Add Maestro to PATH for next steps
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          
          # Verify installation
          maestro --version
        timeout-minutes: 5
        # Maestro CLI is completely free and open-source
        # Installation downloads pre-built binaries, no build required
        # The script adds maestro to ~/.maestro/bin and updates PATH

      # ========================================================================
      # STEP 11: Wait for app to settle
      # ========================================================================
      - name: Wait for app and emulator to settle
        run: |
          # Give emulator and app package manager time to settle
          sleep 10
          
          # Verify device is still connected
          ${ANDROID_HOME}/platform-tools/adb devices
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        # Small delay helps avoid race conditions where app processes
        # are still initializing during first Maestro command

      # ========================================================================
      # STEP 12: Run Maestro Tests (Individual execution for better reporting)
      # ========================================================================
      - name: Run Maestro Tests
        run: |
          # Enable verbose output for debugging
          export MAESTRO_LOG_LEVEL=debug
          
          # Run tests individually like your PowerShell script for better reporting
          cd maestro-tests
          
          # Find all YAML test files
          test_files=$(find . -name "*.yaml" -type f | sort)
          total_tests=$(echo "$test_files" | wc -l)
          passed_tests=0
          failed_tests=()
          
          echo "Found $total_tests test files to run"
          echo ""
          
          # Run each test individually
          for test_file in $test_files; do
            test_name=$(basename "$test_file")
            echo "🧪 Running test: $test_name"
            
            # Run the test and capture output
            if maestro test "$test_file" -p android 2>&1; then
              echo "✅ $test_name PASSED"
              ((passed_tests++))
            else
              echo "❌ $test_name FAILED"
              # Capture the last few lines of output for error details
              error_output=$(maestro test "$test_file" -p android 2>&1 | tail -10)
              failed_tests+=("$test_name: $error_output")
            fi
            echo ""
          done
          
          # Print summary
          echo "📊 Test Summary: $passed_tests/$total_tests tests passed"
          
          # Print failures if any
          if [ ${#failed_tests[@]} -gt 0 ]; then
            echo ""
            echo "❌ Failed Tests:"
            for failure in "${failed_tests[@]}"; do
              echo "  - $failure"
            done
            echo ""
            exit 1
          else
            echo "🎉 All tests passed!"
          fi
        # This approach:
        # - Runs each test individually (like your PowerShell script)
        # - Continues running all tests even if some fail
        # - Provides detailed per-test results
        # - Shows clear pass/fail summary
        # - Captures error details for failed tests
        timeout-minutes: 30

      # ========================================================================
      # STEP 13: Capture Emulator Logs on Failure
      # ========================================================================
      - name: Capture emulator logs on failure
        if: failure()
        run: |
          echo "=== Emulator System Log ===" >> maestro-failure-report.txt
          timeout 10s ${ANDROID_HOME}/platform-tools/adb logcat -d >> maestro-failure-report.txt 2>&1 || echo "ADB logcat timed out or failed" >> maestro-failure-report.txt
          
          echo "" >> maestro-failure-report.txt
          echo "=== Emulator Processes ===" >> maestro-failure-report.txt
          timeout 5s ${ANDROID_HOME}/platform-tools/adb shell ps >> maestro-failure-report.txt 2>&1 || echo "ADB shell ps timed out or failed" >> maestro-failure-report.txt
          
          echo "" >> maestro-failure-report.txt
          echo "=== Installed Packages ===" >> maestro-failure-report.txt
          timeout 5s ${ANDROID_HOME}/platform-tools/adb shell pm list packages | grep -i tictoe >> maestro-failure-report.txt 2>&1 || echo "ADB pm list timed out or failed" >> maestro-failure-report.txt
          
          echo "" >> maestro-failure-report.txt
          echo "=== Emulator Status ===" >> maestro-failure-report.txt
          ${ANDROID_HOME}/platform-tools/adb devices >> maestro-failure-report.txt 2>&1 || echo "ADB devices check failed" >> maestro-failure-report.txt
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        timeout-minutes: 1
        # Runs only on failure, collects diagnostic info for troubleshooting
        # Added timeouts to prevent hanging on unresponsive emulator

      # ========================================================================
      # STEP 14: Upload failure artifacts
      # ========================================================================
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-failure-logs
          path: |
            maestro-failure-report.txt
            /tmp/emulator.log
        # Preserves failure logs for post-mortem analysis
        # Artifacts are downloadable from GitHub Actions UI for 90 days
