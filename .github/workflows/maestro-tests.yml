name: Maestro UI Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # Java required for Android
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Add Android tools to PATH
    - name: Add Android SDK to PATH
      run: |
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

    # Install required Android packages
    - name: Install Android SDK packages
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-33" \
          "emulator" \
          "system-images;android-33;google_apis;x86_64"

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses

    # Create emulator
    - name: Create Android Emulator
      run: |
        echo "no" | avdmanager create avd \
          -n Pixel_API_33 \
          -k "system-images;android-33;google_apis;x86_64" \
          -d pixel

    # Start emulator
    - name: Start Android Emulator
      run: |
        emulator -avd Pixel_API_33 -no-window -no-audio -no-snapshot &

        adb wait-for-device

        boot_completed=""
        until [[ "$boot_completed" == "1" ]]; do
          sleep 5
          boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          echo "Waiting for emulator..."
        done

        adb shell input keyevent 82

    # Build MAUI APK
    - name: Build MAUI Android APK
      run: |
        cd src/TicToe.Infinite

        dotnet publish \
          -f net8.0-android \
          -c Release \
          -p:AndroidPackageFormat=apk \
          -p:TrimPackageSize=true \
          --self-contained false

    # Install APK
    - name: Install APK
      run: |
        APK=$(find src/TicToe.Infinite/bin/Release -name "*.apk" | head -1)

        echo "Installing $APK"

        adb install -r "$APK"

    # Install Maestro
    - name: Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile/install.sh" | bash
        echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        maestro --version

    # Wait for device stability
    - name: Wait for device
      run: |
        adb devices
        sleep 10

    # Run Maestro tests
    - name: Run Maestro tests
      run: |
        export MAESTRO_LOG_LEVEL=debug

        cd maestro-tests

        test_files=$(find . -name "*.yaml" | sort)

        for test in $test_files
        do
          echo "Running $test"
          maestro test "$test" -p android
        done

    # Capture logs if failure
    - name: Capture logs
      if: failure()
      run: |
        adb logcat -d > emulator-log.txt

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-logs
        path: emulator-log.txt