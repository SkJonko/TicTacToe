name: Maestro UI Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # Java required for Android tools
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # Install .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Install only the Android MAUI workload (iOS not supported on Linux runners)
    - name: Install MAUI Android workload
      working-directory: src/TicToe.Infinite
      run: |
        dotnet workload install maui-android || true
        # also restore packages for project (scoped to android below)
        dotnet restore -f net10.0-android

    # Build MAUI APK (Android only)
    - name: Build MAUI Android APK
      working-directory: src/TicToe.Infinite
      run: |
        dotnet publish \
          -f net10.0-android \
          -p:TargetFrameworks=net10.0-android \
          -c Release \
          -p:AndroidPackageFormat=apk \
          --self-contained false

    # Install Maestro CLI
    - name: Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile/install.sh" | bash
        echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        maestro --version

    # Start emulator and run tests
    - name: Run Android Emulator and Tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        profile: pixel
        emulator-options: -no-window -no-audio -no-boot-anim
        script: |

          echo "Emulator started"

          adb devices

          APK=$(find src/TicToe.Infinite/bin/Release -name "*.apk" | head -1)

          echo "Installing $APK"

          adb install -r "$APK"

          sleep 10

          cd maestro-tests

          export MAESTRO_LOG_LEVEL=debug

          test_files=$(find . -name "*.yaml" | sort)

          for test in $test_files
          do
            echo "Running $test"
            maestro test "$test" -p android
          done

    # Capture logs on failure
    - name: Capture logs
      if: failure()
      run: |
        echo "Installing adb for log capture"
        sudo apt-get update
        sudo apt-get install -y android-tools-adb

        adb logcat -d > emulator-log.txt || true

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-logs
        path: emulator-log.txt