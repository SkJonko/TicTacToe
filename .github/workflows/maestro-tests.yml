name: Maestro UI Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # Java required for Android tools
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # .NET for MAUI
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Build MAUI APK
    - name: Build MAUI Android APK
      run: |
        cd src/TicToe.Infinite

        dotnet publish \
          -f net8.0-android \
          -c Release \
          -p:AndroidPackageFormat=apk \
          --self-contained false

    # Install Maestro CLI
    - name: Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile/install.sh" | bash
        echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        maestro --version

    # Start emulator + run tests
    - name: Run Android Emulator and Tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        profile: pixel
        emulator-options: -no-window -no-audio -no-boot-anim
        script: |

          echo "Emulator started"

          adb devices

          APK=$(find src/TicToe.Infinite/bin/Release -name "*.apk" | head -1)

          echo "Installing $APK"

          adb install -r "$APK"

          sleep 10

          cd maestro-tests

          export MAESTRO_LOG_LEVEL=debug

          test_files=$(find . -name "*.yaml" | sort)

          for test in $test_files
          do
            echo "Running $test"
            maestro test "$test" -p android
          done

    # Capture logs if tests fail
    - name: Capture logs
      if: failure()
      run: |
        adb logcat -d > emulator-log.txt

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-logs
        path: emulator-log.txt